[project]
name = "financial-risk-platform"
version = "0.1.0"
description = "Replayable LendingClub data pipeline and tested credit-risk analytics foundation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dbt-duckdb>=1.11.0",
    "duckdb>=1.5.5",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pytest>=9.1.1",
    "tabulate>=0.10.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "dbt-duckdb>=1.11.0",
    "ruff>=0.16.8",
]
